{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>

<form method="post" action="{{ url_for('change_password') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="row"><label for="current_password">Current password</label><input type="password" id="current_password" name="current_password" required autofocus></div>
  {% if errors.current_password %}<span class="field-error">{{ errors.current_password }}</span>{% endif %}
  <div class="row"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" required minlength="8"></div>
  {% if errors.new_password %}<span class="field-error">{{ errors.new_password }}</span>{% endif %}
  <div class="row"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" required minlength="8"></div>
  {% if errors.confirm %}<span class="field-error">{{ errors.confirm }}</span>{% endif %}
  <div class="row"><button type="submit">Change password</button></div>
</form>
{% endblock %}
